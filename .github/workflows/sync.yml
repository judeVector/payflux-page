name: Sync to Organization Repo
on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Push to Organization Repo
        run: |
          git remote add org-repo https://github.com/getpayflux/payflux-ui.git
          git push --force org-repo main
